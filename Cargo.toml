[workspace]
resolver = "2"
members = [
    "crates/mg-diag",
    "crates/mg-syntax",
    "crates/mg-hir",
    "crates/mg-geom",
    "crates/mg-eval",
    "crates/mg-font",
    "crates/mg-lsp",
    "crates/mg-cli",
]
exclude = ["editors/zed"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mg-diag = { path = "crates/mg-diag" }
mg-eval = { path = "crates/mg-eval" }
mg-font = { path = "crates/mg-font" }
mg-geom = { path = "crates/mg-geom" }
mg-hir = { path = "crates/mg-hir" }
mg-lsp = { path = "crates/mg-lsp" }
mg-syntax = { path = "crates/mg-syntax" }

clap = { version = "4.6.7", features = ["derive"] }
codespan-reporting = "0.13.1"
indexmap = "2.14.2"
kurbo = "0.13.1"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
read-fonts = "0.44.0"
rowan = "0.17.0"
serde = "1.0.229"
serde_json = "1.0.151"
skrifa = "0.47.0"
write-fonts = "0.53.0"

insta = "1.48.0"
proptest = "1.11.0"
tiny-skia = "0.12.0"
