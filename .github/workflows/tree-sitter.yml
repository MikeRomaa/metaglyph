name: Tree-sitter

on:
  push:
    branches: [main]
    paths:
      - "editors/tree-sitter/**"
      - "editors/zed/languages/**"
      - ".github/workflows/tree-sitter.yml"
  pull_request:
    paths:
      - "editors/tree-sitter/**"
      - "editors/zed/languages/**"
      - ".github/workflows/tree-sitter.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/tree-sitter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/tree-sitter/package-lock.json
      - run: npm ci
      - run: npx tree-sitter test
